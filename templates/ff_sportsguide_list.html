{% extends "base.html" %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex align-items-center flex-wrap mb-2">
    <h4 class="mr-3 mb-1">A 채널</h4>
    <button id="sg-reload" class="btn btn-sm btn-primary mr-2" type="button">지금 갱신</button>
  </div>
  <p class="small text-muted mb-2" id="sg-info">경기 목록을 불러오는 중입니다...</p>
  <p class="small text-danger mb-2" id="sg-warning" style="display:none"></p>
  <div class="table-responsive">
    <table class="table table-sm table-striped table-hover" id="sg-table">
      <thead class="thead-dark"><tr>
        <th style="width:54px">SEQ</th><th style="width:120px">채널</th>
        <th>방송 중 프로그램</th><th style="width:170px">리그 / 시작 시간</th>
        <th style="width:155px">재생</th>
      </tr></thead>
      <tbody id="sg-rows"><tr><td colspan="5">로딩 중...</td></tr></tbody>
    </table>
  </div>
  <p class="small text-muted">채널별 HLS 주소는 패턴을 이용해 생성됩니다. 목록에 있다고 해서 실제 영상 재생이 항상 보장되는 것은 아닙니다. 링크가 변경되면 설정에서 수정하세요.</p>
</div>
<form id="sg-play-form" action="/videojs" method="post" target="sg-sports-player" style="display:none">
  <input type="hidden" name="play_title" id="sg-title">
  <input type="hidden" name="play_source_src" id="sg-source">
  <input type="hidden" name="play_source_type" value="application/x-mpegURL">
</form>
<script>
(function(){
  var rows=$('#sg-rows'), info=$('#sg-info'), warning=$('#sg-warning');

  function sportLabel(category, league, name){
    var categoryText = String(category || '').trim().toLowerCase();
    var direct = {
      'soccer':'축구','football':'축구','futsal':'풋살',
      'basketball':'농구','volleyball':'배구','baseball':'야구',
      'tennis':'테니스','table tennis':'탁구','badminton':'배드민턴',
      'ice hockey':'아이스하키','hockey':'하키','golf':'골프',
      'handball':'핸드볼','rugby':'럭비','cricket':'크리켓',
      'boxing':'복싱','mma':'격투기','ufc':'격투기',
      'esports':'e스포츠','e-sports':'e스포츠',
      'snooker':'당구','billiards':'당구',
      'motorsport':'모터스포츠','motorsports':'모터스포츠',
      'american football':'미식축구'
    };
    if(direct[categoryText]) return direct[categoryText];

    var text = [category, league, name].join(' ').toLowerCase();
    var rules = [
      ['미식축구', /\b(nfl|ncaa\s*football|american\s*football)\b|미식축구/i],
      ['풋살', /\bfutsal\b|풋살/i],
      ['축구', /\b(epl|premier\s*league|la\s*liga|laliga|serie\s*a|bundesliga|ligue\s*1|ucl|uefa|champions\s*league|europa\s*league|k\s*league|kleague|mls|afc|fifa|world\s*cup|soccer)\b|축구|챔피언스리그|유로파/i],
      ['농구', /\b(nba|wnba|kbl|wkbl|euroleague|ncaa\s*basketball|basketball)\b|농구/i],
      ['배구', /\b(kovo|v-?league|volleyball)\b|배구/i],
      ['야구', /\b(kbo|mlb|npb|cpbl|baseball)\b|야구/i],
      ['테니스', /\b(wta|wat|atp|itf|tennis)\b|테니스/i],
      ['탁구', /\b(table\s*tennis|wtt)\b|탁구/i],
      ['배드민턴', /\b(badminton|bwf)\b|배드민턴/i],
      ['아이스하키', /\b(nhl|khl|ice\s*hockey)\b|아이스하키/i],
      ['하키', /\bhockey\b|하키/i],
      ['골프', /\b(pga|lpga|golf)\b|골프/i],
      ['핸드볼', /\b(handball|ehf)\b|핸드볼/i],
      ['럭비', /\b(rugby|six\s*nations)\b|럭비/i],
      ['크리켓', /\b(cricket|ipl)\b|크리켓/i],
      ['복싱', /\bboxing\b|복싱/i],
      ['격투기', /\b(ufc|mma|one\s*championship)\b|격투기/i],
      ['e스포츠', /\b(esports|e-sports|league\s*of\s*legends|valorant|dota|starcraft)\b|e스포츠|이스포츠/i],
      ['당구', /\b(snooker|billiards|pool)\b|당구/i],
      ['모터스포츠', /\b(formula\s*1|f1|motogp|nascar|motorsports?)\b|모터스포츠/i]
    ];
    for(var i=0;i<rules.length;i++) if(rules[i][1].test(text)) return rules[i][0];
    return '기타';
  }

  function displayMatchName(name, category, league){
    var raw = String(name || '').trim();
    var label = sportLabel(category, league, raw);
    if(!raw) return '[' + label + ']';
    var prefix = '[' + label + ']';
    if(raw.indexOf(prefix) === 0) return raw;
    return prefix + ' ' + raw;
  }
  function streamUrl(item){ return item.url || ''; }
  function load(force){
    $('#sg-reload').prop('disabled',true);
    $.ajax({url:'/ff_sportsguide/ajax/channel_list',method:'POST',data:{refresh:force?'true':'false'},dataType:'json'})
    .done(function(resp){
      rows.empty();
      var list=resp.channels||[];
      var updated=resp.updated_at ? new Date(resp.updated_at).toLocaleString('ko-KR') : '기록 없음';
      info.text('방송 중 '+(resp.live_count||0)+'개 · 방송 예정 '+(resp.upcoming_count||0)+'개 · 업데이트 '+updated);
      if(resp.last_error){warning.show().text('마지막 갱신 실패: '+resp.last_error+' (이전 목록 유지)');}
      else{warning.hide().empty();}
      if(!list.length){rows.append($('<tr>').append($('<td colspan="5">').text('현재 방송 중인 경기가 없습니다.')));return;}
      list.forEach(function(c){
        var tr=$('<tr>');
        tr.append($('<td>').text(c.seq));
        tr.append($('<td>').text(c.channel));
        tr.append($('<td>').text(displayMatchName(c.program, c.category || '', c.league)));
        tr.append($('<td>').text((c.league||'')+' / '+(c.start_time||'')));
        var cell=$('<td>');
        $('<button type="button" class="btn btn-sm btn-primary mr-1">재생</button>')
          .on('click',function(){
            var url=streamUrl(c);
            if(!url){info.text('재생 URL을 확인할 수 없습니다.');return;}
            $('#sg-title').val(displayMatchName(c.program, c.category || '', c.league)); $('#sg-source').val(url);
            window.open('', 'sg-sports-player', 'width=980,height=580,resizable=yes');
            document.getElementById('sg-play-form').submit();
          }).appendTo(cell);
        $('<button type="button" class="btn btn-sm btn-primary">URL</button>')
          .on('click',function(){
            var u=streamUrl(c);
            if(!u){info.text('복사할 URL을 확인할 수 없습니다.');return;}
            if(navigator.clipboard && navigator.clipboard.writeText){
              navigator.clipboard.writeText(u).then(function(){info.text('주소 복사됨: '+u);},function(){window.prompt('재생 주소',u);});
            }else{window.prompt('재생 주소',u);}
          }).appendTo(cell);
        tr.append(cell); rows.append(tr);
      });
    }).fail(function(xhr){
      info.text('목록을 가져오지 못했습니다 ('+xhr.status+')');
      warning.show().text('FF 플러그인 설정과 로그를 확인해 주세요.');
    }).always(function(){$('#sg-reload').prop('disabled',false);});
  }
  $('#sg-reload').on('click',function(){load(true)});
  load(false);
  setInterval(function(){load(false)},60000);
})();
</script>
{% endblock %}
